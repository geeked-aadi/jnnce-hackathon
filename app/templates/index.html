<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Brain Tumor Segmentation (BraTS)</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: #0f1117;
    color: #e5e7eb;
    display: flex;
    justify-content: center;
    padding: 48px 16px;
    margin: 0;
  }
  .card {
    background: #171a23;
    border: 1px solid #262a36;
    border-radius: 12px;
    padding: 32px;
    width: 100%;
    max-width: 560px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { color: #9ca3af; font-size: 13px; margin: 0 0 24px; }
  label {
    display: block;
    font-size: 13px;
    margin: 16px 0 6px;
    color: #cbd5e1;
  }
  input[type="file"] {
    width: 100%;
    padding: 8px;
    background: #0f1117;
    border: 1px solid #2c3140;
    border-radius: 8px;
    color: #e5e7eb;
    font-size: 13px;
  }
  button {
    margin-top: 24px;
    width: 100%;
    padding: 12px;
    background: #4f46e5;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { background: #383c4a; cursor: not-allowed; }
  #download-btn { background: #16a34a; }
  #status { margin-top: 16px; font-size: 13px; color: #9ca3af; min-height: 18px; }
  #status.error { color: #f87171; }
  #status.success { color: #4ade80; }
  #viewer-container {
    margin-top: 20px;
    border: 1px solid #262a36;
    border-radius: 10px;
    padding: 8px;
    background: #0f1117;
  }
  #viewer-frame {
    width: 100%;
    min-height: 480px;
    border: none;
    border-radius: 8px;
    background: #0f1117;
  }
  #legend {
    margin-top: 20px;
    text-align: left;
    border-collapse: collapse;
    width: 100%;
    font-size: 13px;
  }
  #legend th {
    text-align: left;
    color: #9ca3af;
    font-weight: 500;
    padding: 6px 8px;
    border-bottom: 1px solid #262a36;
  }
  #legend td {
    padding: 8px;
    border-bottom: 1px solid #1e2129;
  }
  .swatch {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 3px;
    margin-right: 8px;
    vertical-align: middle;
  }
  #no-tumor {
    display: none;
    margin-top: 16px;
    font-size: 13px;
    color: #9ca3af;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>BraTS Segmentation</h1>
    <p class="sub">Upload all four MRI modalities (NIfTI, .nii or .nii.gz) to run inference.</p>

    <form id="predict-form">
      <label for="flair">FLAIR</label>
      <input type="file" id="flair" name="flair" accept=".nii,.nii.gz" required>

      <label for="t1">T1</label>
      <input type="file" id="t1" name="t1" accept=".nii,.nii.gz" required>

      <label for="t1ce">T1ce</label>
      <input type="file" id="t1ce" name="t1ce" accept=".nii,.nii.gz" required>

      <label for="t2">T2</label>
      <input type="file" id="t2" name="t2" accept=".nii,.nii.gz" required>

      <button type="submit" id="submit-btn">Run Inference</button>
      <div id="status"></div>
    </form>

    <div id="result" style="display:none; margin-top:24px; text-align:center;">
      <img id="preview-img" style="max-width:100%; border-radius:8px; border:1px solid #262a36;">

      <div id="viewer-container" style="display:none;"><iframe id="viewer-frame" title="3D segmentation viewer"></iframe></div>

      <table id="legend">
        <thead>
          <tr>
            <th>Label</th>
            <th>Voxels</th>
            <th>Volume (cm³)</th>
            <th>% of scan</th>
          </tr>
        </thead>
        <tbody id="legend-body"></tbody>
      </table>

      <p id="no-tumor">No tumor regions detected in this scan.</p>

      <button id="download-btn" style="margin-top:16px;">Download .nii.gz</button>
    </div>
  </div>

<script>
const form = document.getElementById("predict-form");
const statusEl = document.getElementById("status");
const btn = document.getElementById("submit-btn");
const resultEl = document.getElementById("result");
const previewImg = document.getElementById("preview-img");
const viewerContainer = document.getElementById("viewer-container");
const viewerFrame = document.getElementById("viewer-frame");
const downloadBtn = document.getElementById("download-btn");
const legendBody = document.getElementById("legend-body");
const legendTable = document.getElementById("legend");
const noTumorEl = document.getElementById("no-tumor");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  btn.disabled = true;
  statusEl.className = "";
  statusEl.textContent = "Running inference... this may take a while on CPU.";
  resultEl.style.display = "none";

  const formData = new FormData(form);

  try {
    const res = await fetch("/predict", {
      method: "POST",
      body: formData
    });

    if (!res.ok) {
      const text = await res.text();
      throw new Error(text || `Request failed with status ${res.status}`);
    }

    const data = await res.json();

    previewImg.src = "data:image/png;base64," + data.overlay_base64;
    viewerFrame.srcdoc = data.viewer_html || "";
    viewerContainer.style.display = data.viewer_html ? "block" : "none";

    legendBody.innerHTML = "";
    if (data.label_stats && data.label_stats.length > 0) {
      legendTable.style.display = "table";
      noTumorEl.style.display = "none";
      data.label_stats.forEach(stat => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td><span class="swatch" style="background:${stat.color}"></span>${stat.name}</td>
          <td>${stat.voxel_count.toLocaleString()}</td>
          <td>${stat.volume_cm3}</td>
          <td>${stat.percent_of_volume}%</td>
        `;
        legendBody.appendChild(row);
      });
    } else {
      legendTable.style.display = "none";
      noTumorEl.style.display = "block";
    }

    downloadBtn.onclick = () => {
      window.location.href = data.download_url;
    };

    resultEl.style.display = "block";
    statusEl.className = "success";
    statusEl.textContent = "Done — preview generated below.";
  } catch (err) {
    statusEl.className = "error";
    statusEl.textContent = "Error: " + err.message;
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
